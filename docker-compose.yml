services:
  ministack:
    image: ministackorg/ministack
    container_name: ministack
    restart: unless-stopped
    ports:
      - "4566:4566"

    volumes:
      - ./deploy/ministack:/docker-entrypoint-initaws.d:ro

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SQS_INPUT_QUEUE_NAME: ${SQS_INPUT_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_QUEUE_NAME: ${SQS_DLQ_QUEUE_NAME:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-events.fifo}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}

  postgres:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path=/migrations
      - -database=postgresql://postgres:123456@postgres:5432/db?sslmode=disable
      - up
    volumes:
      - ./internal/database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak
    restart: unless-stopped

    command: ["start-dev", "--import-realm"]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      PROVIDER_A_CLIENT_SECRET: ${PROVIDER_A_CLIENT_SECRET:-provider-a-local-secret}
      PROVIDER_B_CLIENT_SECRET: ${PROVIDER_B_CLIENT_SECRET:-provider-b-local-secret}
      INTERNAL_SERVICE_CLIENT_SECRET: ${INTERNAL_SERVICE_CLIENT_SECRET:-internal-service-local-secret}

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: 123456

    ports:
      - "8081:8080"

    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Keycloak advertises the public localhost issuer. Host networking lets
    # this Linux development container validate that exact issuer while also
    # reaching the published PostgreSQL and MiniStack ports.
    network_mode: host
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: postgresql://postgres:123456@localhost:5432/db?sslmode=disable
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-20}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8081/realms/wager-challenge}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-wager-api}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-http://localhost:4566}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SQS_INPUT_QUEUE_NAME: ${SQS_INPUT_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_QUEUE_NAME: ${SQS_DLQ_QUEUE_NAME:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-events.fifo}
      SQS_CONSUMER_NAME: ${SQS_CONSUMER_NAME:-wager-transaction-consumer}
      SQS_RECEIVE_WAIT: ${SQS_RECEIVE_WAIT:-20s}
      SQS_VISIBILITY_TIMEOUT: ${SQS_VISIBILITY_TIMEOUT:-30s}
      SQS_PROCESSING_TIMEOUT: ${SQS_PROCESSING_TIMEOUT:-20s}
      SQS_OPERATION_TIMEOUT: ${SQS_OPERATION_TIMEOUT:-5s}
      SQS_IDLE_DELAY: ${SQS_IDLE_DELAY:-1s}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_OPERATION_TIMEOUT: ${OUTBOX_OPERATION_TIMEOUT:-15s}
      PENDING_REFERENCE_POLL_INTERVAL: ${PENDING_REFERENCE_POLL_INTERVAL:-1s}
      PENDING_REFERENCE_OPERATION_TIMEOUT: ${PENDING_REFERENCE_OPERATION_TIMEOUT:-15s}
      PENDING_REFERENCE_BATCH_SIZE: ${PENDING_REFERENCE_BATCH_SIZE:-10}
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-15s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      ministack:
        condition: service_started

volumes:
  postgres_data:
